<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Rapatku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login">

    <!-- Panel kiri: ilustrasi + tagline -->
    <section class="hero" aria-label="Tentang Rapatku">
      <div class="brand">
        <img src="assets/logo.svg" alt="" width="80" height="72">
        <span class="brand-name">R<a class="anjay">a</a>patku</span>
      </div>

      <div class="hero-copy">
        <h2>Kelola rapat<br>lebih mudah</h2>
        <p>kelola jadwal rapat, undang peserta, dan catat kehadiran dalam satu platform.</p>
      </div>
    </section>

    <!-- Panel kanan: form login -->
    <section class="form-side">
      <div class="form-card">
        <h1>Selamat Datang</h1>
        <p class="lead">Masuk untuk melanjutkan ke aplikasi</p>

        <form id="login-form" action="#" method="post" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <div class="input-wrap">
              <input type="email" id="email" name="email" placeholder="Masukkan alamat email" autocomplete="email" required>
              <span class="eye" aria-hidden="true"><img src="assets/eye.svg" alt=""></span>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
              <button type="button" class="eye" id="toggle-password" aria-label="Tampilkan password" aria-pressed="false">
                <img src="assets/eye.svg" alt="">
              </button>
            </div>
          </div>

          <div class="options">
            <label class="remember">
              <input type="checkbox" name="remember">
              <span>Ingat saya</span>
            </label>
            <a class="forgot" href="#">Lupa password?</a>
          </div>

          <p class="form-error" id="form-error" role="alert" hidden></p>

          <button type="submit" class="btn-login">Login</button>
        </form>

        <p class="signup">Belum punya akun? <a href="#">Daftar di sini</a></p>
      </div>
    </section>

  </main>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
